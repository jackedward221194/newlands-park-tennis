
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Newlands Park Tennis Tour!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #173d32;
      margin: 0;
      text-align: center;
    }
    header {
      background: #173d32;
      color: white;
      padding: 45px 20px;
    }
    main { padding: 30px 20px; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin: 15px auto;
      max-width: 500px;
      box-shadow: 0 2px 8px #0001;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎾 Newlands Park Tennis Tour</h1>
    <p>Monthly tournaments, player statistics and records</p>
  </header>
  <main>
    <div class="card">
      <h2>🏆 Leaderboard</h2>
      <p>Player rankings and statistics coming soon!</p>
    </div>
    <div class="card">
      <h2>👤 Player Profiles</h2>
      <p>Explore match records and tournament finishes.</p>
    </div>
    <div class="card">
      <h2>📅 Tournament History</h2>
      <p>Results from every monthly tournament.</p>
    </div>
  </main>
</body>
</html>
